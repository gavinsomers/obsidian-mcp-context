[scan]
include_globs = ["**/*.md"]
exclude_globs = [
  ".git/**",
  ".obsidian/**",
  "System/Marts/**",
]
source_extensions = [".md"]

[entities]
non_entity_note_types = [
  "daily",
  "meeting",
  "note",
  "research",
]

[entities.folders]
Companies = "company"
Daily = "daily"
Decisions = "decision"
Meetings = "meeting"
People = "person"
Projects = "project"
Research = "research"
Risks = "risk"

[replay_qa]
entity_type_preferences = ["project", "person", "company"]
eval_pack = "generated-demo"

[replay_qa.intent_words]
decisions = ["decision", "decisions", "decided"]
risks = ["risk", "risks", "blocker", "blockers"]
open_loops = ["open", "loop", "loops", "todo", "task", "tasks", "followup", "follow-up"]
timeline = ["timeline", "history", "when", "sequence"]
