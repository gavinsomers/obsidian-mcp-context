[source]
type = "sample"
sample_name = "synthetic-vault"
vault_path = ""

[pipeline]
output_dir = "var"
run_mode = "local"

[privacy]
allow_raw_text_to_ai = false
allow_hosted_ai = true
max_context_chars = 1500
redact_file_paths = true

[ai]
enabled = true
provider = "openai"
model = "gpt-4.1-mini"
base_url = ""
api_key_env = "OPENAI_API_KEY"
