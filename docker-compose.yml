services:
  vault:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/synthetic-vault:/usr/share/nginx/html:ro
      - ./docker/nginx/vault-browser.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  web:
    build:
      context: .
    environment:
      DUCKDB_PATH: /warehouse/obsidian-read.duckdb
      OBSIDIAN_MCP_ALLOWED_ROOTS: /vault
    command:
      - obsidian-mcp-context-web
      - --vault
      - /vault
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./examples/synthetic-vault:/vault:ro
      - ./var:/warehouse
    ports:
      - "8080:8080"
    depends_on:
      - vault

  mcp:
    build:
      context: .
    environment:
      DUCKDB_PATH: /warehouse/obsidian-read.duckdb
      OBSIDIAN_MCP_ALLOWED_ROOTS: /vault
    command:
      - obsidian-mcp-context-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - ./examples/synthetic-vault:/vault:ro
      - ./var:/warehouse
    ports:
      - "8000:8000"

  ingest:
    build:
      context: .
    profiles:
      - pipeline
    command:
      - obsidian-mcp-context-ingest
      - --vault
      - /vault
      - --duckdb
      - /warehouse/obsidian.duckdb
    volumes:
      - ./examples/synthetic-vault:/vault:ro
      - ./var:/warehouse

  dbt:
    build:
      context: .
    profiles:
      - pipeline
    environment:
      DUCKDB_PATH: /warehouse/obsidian.duckdb
      READ_DUCKDB_PATH: /warehouse/obsidian-read.duckdb
    command:
      - sh
      - -c
      - >
        dbt run --profiles-dir dbt &&
        dbt test --profiles-dir dbt &&
        cp /warehouse/obsidian.duckdb /warehouse/obsidian-read.duckdb.tmp &&
        mv /warehouse/obsidian-read.duckdb.tmp /warehouse/obsidian-read.duckdb
    volumes:
      - ./var:/warehouse

  pipeline:
    build:
      context: .
    profiles:
      - check
      - pipeline
    environment:
      DUCKDB_PATH: /warehouse/obsidian.duckdb
      READ_DUCKDB_PATH: /warehouse/obsidian-read.duckdb
    command:
      - sh
      - -c
      - >
        obsidian-mcp-context-ingest --vault /vault --duckdb /warehouse/obsidian.duckdb &&
        dbt run --profiles-dir dbt &&
        dbt test --profiles-dir dbt &&
        cp /warehouse/obsidian.duckdb /warehouse/obsidian-read.duckdb.tmp &&
        mv /warehouse/obsidian-read.duckdb.tmp /warehouse/obsidian-read.duckdb &&
        python -m pytest &&
        python -m compileall obsidian_mcp_context &&
        obsidian-mcp-context --vault /vault warehouse-summary
    volumes:
      - ./examples/synthetic-vault:/vault:ro
      - ./var:/warehouse

  seed-vault:
    build:
      context: .
    profiles:
      - simulation
    user: "50000:0"
    command:
      - obsidian-mcp-context-generate-vault
      - --profile
      - ${SIM_PROFILE:-medium}
      - --seed
      - ${SIM_SEED:-42}
      - --output
      - /seed-vault
      - --force
    volumes:
      - seed-vault:/seed-vault

  vault-simulator:
    build:
      context: .
    profiles:
      - simulation
    user: "50000:0"
    command:
      - obsidian-mcp-context-simulate-vault
      - advance
      - --seed-vault
      - /seed-vault
      - --live-vault
      - /live-vault
      - --state
      - /warehouse/simulation-state.json
      - --days
      - ${SIM_VIRTUAL_DAYS_PER_RUN:-12}
    volumes:
      - seed-vault:/seed-vault:ro
      - live-vault:/live-vault
      - simulation-warehouse:/warehouse
    depends_on:
      seed-vault:
        condition: service_completed_successfully

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles:
      - simulation
    command:
      - bash
      - -c
      - >
        set -e;
        chown -R airflow:0 /seed-vault /live-vault /warehouse;
        chmod -R g+rwX /seed-vault /live-vault /warehouse;
        airflow db migrate;
        airflow users create
        --username admin
        --password admin
        --firstname Gavin
        --lastname Somers
        --role Admin
        --email admin@example.com || true;
        airflow scheduler &
        exec airflow webserver
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////warehouse/airflow.db
      DUCKDB_PATH: /warehouse/obsidian.duckdb
      READ_DUCKDB_PATH: /warehouse/obsidian-read.duckdb
      SIM_SEED_VAULT: /seed-vault
      SIM_LIVE_VAULT: /live-vault
      SIM_STATE_PATH: /warehouse/simulation-state.json
      SIM_PROFILE: ${SIM_PROFILE:-medium}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_VIRTUAL_DAYS_PER_RUN: ${SIM_VIRTUAL_DAYS_PER_RUN:-12}
    volumes:
      - seed-vault:/seed-vault
      - live-vault:/live-vault
      - simulation-warehouse:/warehouse
    ports:
      - "8082:8080"

  live-vault:
    image: nginx:1.27-alpine
    profiles:
      - simulation
    volumes:
      - type: volume
        source: live-vault
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
      - ./docker/nginx/vault-browser.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"

  live-web:
    build:
      context: .
    profiles:
      - simulation
    environment:
      DUCKDB_PATH: /warehouse/obsidian-read.duckdb
      OBSIDIAN_MCP_ALLOWED_ROOTS: /live-vault
    command:
      - obsidian-mcp-context-web
      - --vault
      - /live-vault
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - live-vault:/live-vault:ro
      - simulation-warehouse:/warehouse
    ports:
      - "8084:8080"

  live-mcp:
    build:
      context: .
    profiles:
      - simulation
    environment:
      DUCKDB_PATH: /warehouse/obsidian-read.duckdb
      OBSIDIAN_MCP_ALLOWED_ROOTS: /live-vault
    command:
      - obsidian-mcp-context-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - live-vault:/live-vault:ro
      - simulation-warehouse:/warehouse
    ports:
      - "8001:8000"

volumes:
  seed-vault:
  live-vault:
  simulation-warehouse:
