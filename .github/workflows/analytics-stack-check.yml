name: Analytics Stack Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-stack:
    name: Postgres Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run analytics stack check
        run: scripts/analytics_stack_check.sh
