name: obsidian-mcp-context-analytics

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_context}
      POSTGRES_USER: ${POSTGRES_USER:-obsidian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-obsidian:
    build:
      context: .
      dockerfile: docker/obsidian/Dockerfile
      args:
        OBSIDIAN_VERSION: ${OBSIDIAN_VERSION:-1.12.7}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${OBSIDIAN_WEB_PORT:-3000}:3000"
    volumes:
      - obsidian-config:/config
      - ${VAULT_PATH:-./examples/synthetic-vault}:/vault:rw

  ingest:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: runtime-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_context}
      POSTGRES_RAW_SCHEMA: ${POSTGRES_RAW_SCHEMA:-raw}
      OBSIDIAN_MCP_VAULT_PROFILE: ${OBSIDIAN_MCP_VAULT_PROFILE:-}
    volumes:
      - ${VAULT_PATH:-./examples/synthetic-vault}:/vault:ro
    command:
      - obsidian-mcp-context-ingest-postgres
      - --vault
      - /vault

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_TARGET: postgres
      DBT_SOURCE_SCHEMA: ${POSTGRES_RAW_SCHEMA:-raw}
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-marts}
      DBT_THREADS: ${DBT_THREADS:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_context}
      POSTGRES_USER: ${POSTGRES_USER:-obsidian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["dbt", "run", "--profiles-dir", "dbt", "--project-dir", "."]

  dbt-test:
    extends:
      service: dbt
    command: ["dbt", "test", "--profiles-dir", "dbt", "--project-dir", "."]

  dbt-docs-generate:
    extends:
      service: dbt
    command: ["dbt", "docs", "generate", "--profiles-dir", "dbt", "--project-dir", "."]

  dbt-docs:
    extends:
      service: dbt
    ports:
      - "${DBT_DOCS_PORT:-8081}:8080"
    command:
      - sh
      - -lc
      - >-
        dbt docs generate --profiles-dir dbt --project-dir .
        && dbt docs serve --profiles-dir dbt --project-dir .
        --host 0.0.0.0 --port 8080 --no-browser

  postgres-browser:
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${POSTGRES_BROWSER_PORT:-8082}:8080"

  replay-dashboard:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: runtime-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_context}
      POSTGRES_RAW_SCHEMA: ${POSTGRES_RAW_SCHEMA:-raw}
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-marts}
      REPLAY_STATE_DIR: /replay-vault
    volumes:
      - ${REPLAY_TARGET_VAULT:-./var/replay-vault}:/replay-vault:ro
    ports:
      - "${REPLAY_DASHBOARD_PORT:-8083}:8083"
    command:
      - obsidian-mcp-context-replay-dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8083"
      - --state-dir
      - /replay-vault

  replay-qa:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: runtime-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_context}
      POSTGRES_RAW_SCHEMA: ${POSTGRES_RAW_SCHEMA:-raw}
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-marts}
      REPLAY_STATE_DIR: /replay-vault
      VAULT_PATH: /vault
      OBSIDIAN_MCP_ALLOWED_ROOTS: /vault
      OBSIDIAN_MCP_VAULT_PROFILE: ${OBSIDIAN_MCP_VAULT_PROFILE:-}
      REPLAY_QA_SUMMARY_MODEL: ${REPLAY_QA_SUMMARY_MODEL:-gemma4:26b-a4b-it-q4_K_M}
      REPLAY_QA_OLLAMA_BASE_URL: ${REPLAY_QA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REPLAY_QA_SUMMARY_MAX_CONTEXT_CHARS: ${REPLAY_QA_SUMMARY_MAX_CONTEXT_CHARS:-12000}
    volumes:
      - ${REPLAY_TARGET_VAULT:-./var/replay-vault}:/replay-vault:ro
      - ${REPLAY_TARGET_VAULT:-./var/replay-vault}:/vault:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REPLAY_QA_PORT:-8084}:8084"
    command:
      - obsidian-mcp-context-replay-qa
      - --host
      - 0.0.0.0
      - --port
      - "8084"
      - --vault
      - /vault
      - --state-dir
      - /replay-vault

  mcp:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: runtime-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_context}
      WAREHOUSE_BACKEND: postgres
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-marts}
      OBSIDIAN_MCP_ALLOWED_ROOTS: /vault
      OBSIDIAN_MCP_VAULT_PROFILE: ${OBSIDIAN_MCP_VAULT_PROFILE:-}
    volumes:
      - ${VAULT_PATH:-./examples/synthetic-vault}:/vault:ro
    ports:
      - "${MCP_PORT:-8000}:8000"
    command:
      - obsidian-mcp-context-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  enrichment:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      target: runtime-postgres
    profiles: ["ai"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_context}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OBSIDIAN_MCP_AI_MODEL: ${OBSIDIAN_MCP_AI_MODEL:-gemma4:26b-a4b-it-q4_K_M}
    command:
      - python
      - -c
      - >-
        import os; print("AI enrichment container is reserved for the Postgres
        mart/review adapter. Local Ollama model target:
        " + os.environ["OBSIDIAN_MCP_AI_MODEL"] + ". Start ollama now and wire
        the explicit enrichment job once that adapter lands.")

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  obsidian-config:
  ollama-data:
