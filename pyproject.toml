[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp-context"
version = "0.3.0"
description = "Turn textual Obsidian vaults into AI-ready context exposed through MCP."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
obsidian-mcp-context = "obsidian_mcp_context.cli:main"
obsidian-mcp-context-mcp = "obsidian_mcp_context.mcp_server:main"
obsidian-mcp-context-web = "obsidian_mcp_context.web_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["obsidian_mcp_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
