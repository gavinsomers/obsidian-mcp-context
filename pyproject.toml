[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp-context"
version = "1.0.0rc3"
description = "Turn textual Obsidian vaults into AI-ready context exposed through MCP."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.0",
  "pydantic>=2.0.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
pipeline = [
  "dbt-postgres>=1.9.0",
]

[project.scripts]
obsidian-mcp-context = "obsidian_mcp_context.cli:main"
obsidian-mcp-context-mcp = "obsidian_mcp_context.mcp_server:main"
obsidian-mcp-context-ingest-postgres = "obsidian_mcp_context.ingest_postgres:main"
obsidian-mcp-context-replay-vault = "obsidian_mcp_context.replay_loader:main"
obsidian-mcp-context-replay-scheduler = "obsidian_mcp_context.replay_scheduler:main"
obsidian-mcp-context-replay-dashboard = "obsidian_mcp_context.replay_dashboard:main"
obsidian-mcp-context-replay-qa = "obsidian_mcp_context.replay_qa:main"
obsidian-mcp-context-synthetic-demo-health = "obsidian_mcp_context.synthetic_demo_health:main"
obsidian-mcp-context-profile-vault = "obsidian_mcp_context.profiler:main"
obsidian-mcp-context-reconcile-pipeline = "obsidian_mcp_context.pipeline_reconciliation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["obsidian_mcp_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
