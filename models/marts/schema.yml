version: 2

models:
  - name: dim_notes
    columns:
      - name: note_id
        tests:
          - not_null
          - unique
      - name: source_path
        tests:
          - not_null
          - unique
      - name: note_type
        tests:
          - not_null
      - name: source_created_at
        tests:
          - not_null
      - name: source_observed_at
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: updated_at
        tests:
          - not_null

  - name: dim_entities
    columns:
      - name: entity_id
        tests:
          - not_null
          - unique
      - name: entity_type
        tests:
          - not_null
      - name: name
        tests:
          - not_null

  - name: dim_entity_types
    columns:
      - name: entity_type
        tests:
          - not_null
          - unique
      - name: display_name
        tests:
          - not_null
      - name: source_strategy
        tests:
          - not_null

  - name: fact_blocks
    columns:
      - name: block_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id

  - name: fact_tasks
    columns:
      - name: task_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: block_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_blocks')
                field: block_id

  - name: fact_links
    columns:
      - name: link_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: block_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_blocks')
                field: block_id

  - name: fact_tags
    columns:
      - name: tag_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: block_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_blocks')
                field: block_id

  - name: fact_mentions
    columns:
      - name: mention_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: block_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_blocks')
                field: block_id
      - name: target_entity_type
        tests:
          - not_null
      - name: target_name
        tests:
          - not_null

  - name: fact_entity_relationships
    columns:
      - name: relationship_id
        tests:
          - not_null
          - unique
      - name: source_entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: target_entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: relationship_type
        tests:
          - not_null

  - name: fact_entity_states
    columns:
      - name: state_id
        tests:
          - not_null
          - unique
      - name: entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: entity_type
        tests:
          - not_null
      - name: state_type
        tests:
          - not_null
      - name: state_value
        tests:
          - not_null

  - name: fact_entity_events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: entity_type
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
      - name: source_path
        tests:
          - not_null

  - name: dim_people
    columns:
      - name: person_id
        tests:
          - not_null
          - unique
      - name: name
        tests:
          - not_null

  - name: dim_companies
    columns:
      - name: company_id
        tests:
          - not_null
          - unique
      - name: name
        tests:
          - not_null

  - name: dim_projects
    columns:
      - name: project_id
        tests:
          - not_null
          - unique
      - name: name
        tests:
          - not_null

  - name: fact_decisions
    columns:
      - name: decision_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: decision_status
        tests:
          - not_null
      - name: summary
        tests:
          - not_null

  - name: fact_risks
    columns:
      - name: risk_id
        tests:
          - not_null
          - unique
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: risk_status
        tests:
          - not_null
      - name: summary
        tests:
          - not_null

  - name: mart_open_loops
    columns:
      - name: open_loop_id
        tests:
          - not_null
          - unique
      - name: task_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_tasks')
                field: task_id
      - name: task_text
        tests:
          - not_null

  - name: mart_entity_open_loops
    columns:
      - name: entity_open_loop_id
        tests:
          - not_null
          - unique
      - name: entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: open_loop_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_open_loops')
                field: open_loop_id
      - name: task_text
        tests:
          - not_null

  - name: mart_entity_context
    columns:
      - name: entity_context_id
        tests:
          - not_null
          - unique
      - name: entity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: entity_id
      - name: event_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_entity_events')
                field: event_id

  - name: mart_person_context
    columns:
      - name: person_context_id
        tests:
          - not_null
          - unique
      - name: person_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_people')
                field: person_id
      - name: timeline_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_timeline')
                field: timeline_id

  - name: mart_project_context
    columns:
      - name: project_context_id
        tests:
          - not_null
          - unique
      - name: project_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_projects')
                field: project_id
      - name: timeline_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_timeline')
                field: timeline_id

  - name: mart_timeline
    columns:
      - name: timeline_id
        tests:
          - not_null
          - unique
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['block', 'task_open', 'task_done']
      - name: note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_notes')
                field: note_id
      - name: source_path
        tests:
          - not_null
      - name: start_line
        tests:
          - not_null
      - name: summary
        tests:
          - not_null
