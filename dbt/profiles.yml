obsidian_mcp_context:
  target: "{{ env_var('DBT_TARGET', 'postgres') }}"
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'obsidian') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'obsidian') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'obsidian_context') }}"
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'marts') }}"
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
